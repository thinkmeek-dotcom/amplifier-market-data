   name: Fetch market data

   # Step 1: manual runs only. We add the monthly schedule after the numbers look right.
   on:
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     fetch:
       runs-on: ubuntu-latest
       timeout-minutes: 20
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"

         - name: Download and filter Redfin county data
           run: python scripts/fetch_redfin.py

         - name: Save results to the repo
           run: |
             git config user.name "github-actions[bot]"
             git config user.email "github-actions[bot]@users.noreply.github.com"
             git add data/
             git diff --cached --quiet || git commit -m "Update market snapshot"
             git push
